name: output

on:
  push:
    paths-ignore:
      - "README.md"
      - "TODO.md"
  pull_request:
    paths-ignore:
      - "README.md"
      - "TODO.md"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to publish badges to the 'badges' branch
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install -e ".[test]"
        pip install pylint "flake8>=6.1" flake8-html genbadge[tests,coverage,flake8]

    - name: Run tests with coverage
      run: pytest --cov=acoustic_outputs --cov-report=lcov

    - name: Upload coverage to Coveralls
      uses: coverallsapp/github-action@v2
      if: matrix.python-version == '3.12'   # upload once, not once per matrix entry
      with:
        file: coverage.lcov
